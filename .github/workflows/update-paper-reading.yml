name: One-time update paper reading

on:
  push:
    paths:
      - '.github/workflows/update-paper-reading.yml'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Insert September 2026 paper reading entries
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          rows = [
              '|2026.09.14| 李文杰    <br>  （Agent Skill Evolution） |[《WikiSkill: Compiling Agent Experience into Persistent Knowledge for Skill Evolution》（arXiv 2026）](https://arxiv.org/abs/2608.27454) | |',
              '|2026.09.07| 刘昀哲    <br>  （Deep Search Agents） |[《DeepSearch-World: Self-Distillation for Deep Search Agents in a Verifiable Environment》（arXiv 2026）](https://arxiv.org/pdf/2607.07820) | |',
          ]
          marker = '|---|:---:|---|---|\n'
          if marker not in text:
              raise SystemExit('README table header marker not found')
          missing = [row for row in rows if row not in text]
          if missing:
              text = text.replace(marker, marker + '\n'.join(missing) + '\n', 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit README update and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-paper-reading.yml
          git add README.md
          git commit -m "Update paper reading schedule for Sep 7 and Sep 14, 2026"
          git push origin HEAD:main
